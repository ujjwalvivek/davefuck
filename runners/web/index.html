<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://cdn.ujjwalvivek.com/icons/logo192.png">
    <title>DaveFuck</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        background: #111;
        color: #eee;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      main {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      canvas {
        image-rendering: pixelated;
        background: #171717;
      }

      .status {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: #aaa;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="screen" width="512" height="176" aria-label="Brainfuck Dave playfield"></canvas>
      <div id="status" class="status">Loading ROM...</div>
    </main>
    <script type="module" src="./runtime.js"></script>
  </body>
</html>
