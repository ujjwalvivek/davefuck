<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://cdn.ujjwalvivek.com/icons/logo192.png">
    <title>DaveFuck</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        background: #111;
        color: #eee;
      }

      body {
        margin: 0;
        width: 100vw;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      main {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
      }

      canvas {
        image-rendering: pixelated;
        background: #171717;
        aspect-ratio: 16 / 9;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="screen" width="640" height="360" aria-label="Brainfuck Dave playfield"></canvas>
    </main>
    <script type="module" src="./runtime.js"></script>
  </body>
</html>
